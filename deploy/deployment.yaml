apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-masters
  namespace: go-masters
  labels:
    app: go-masters
spec:
  revisionHistoryLimit: 2
  replicas: 3
  selector:
    matchLabels:
      app: go-masters
  template:
    metadata:
      labels:
        app: go-masters
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   /healthz
        prometheus.io/port:   "8080"
    spec:
      containers:
        - name: app
          image: localhost:5000/go-masters:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
